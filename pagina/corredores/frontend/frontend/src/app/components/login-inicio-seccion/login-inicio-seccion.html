<div class="login-container">
    <h1 class="title">{{ company.name }}</h1>
    <h2 class="texto-title">Inicio de Sesión</h2>
    <p class="descripcion-title">{{ company.welcomeMessage }}</p>

    <div *ngIf="error" class="error-message" style="color: red; margin-bottom: 15px; padding: 10px; background-color: #ffe0e0; border-radius: 4px;">
        {{ error }}
    </div>
    <div *ngIf="success" class="success-message" style="color: green; margin-bottom: 15px; padding: 10px; background-color: #e0ffe0; border-radius: 4px;">
        {{ success }}
    </div>

    <form [formGroup]="loginForm">
        <div class="email-container">
            <label for="email" class="texto-email">Correo electrónico</label>
            <input type="email" id="email" formControlName="email" class="input-email" placeholder="Ingresa tu correo">
        </div>

        <div class="password-container">
            <label for="password" class="texto-password">Contraseña</label>
            <input type="password" id="password" formControlName="password" class="input-password" placeholder="Ingresa tu contraseña">
            <a href="/olvide-mi-contraseña" class="registro-link-p">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="button" class="inicio-btn" (click)="onLogin()" [disabled]="loading || loginForm.invalid">
            {{ loading ? 'Cargando...' : 'Iniciar Sesión' }}
        </button>
    </form>

    <hr class="linea-separadora">
    <div id="google-btn"></div>
    <hr class="linea-separadora">
    <div class="registro-container">
        <p class="texto-1">¿no tienes cuenta?</p>
        <a href="/registro" class="registro-link">Registrarse</a>
    </div>
</div>
